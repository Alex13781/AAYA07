<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compulsory English – Grade XII Asmita Publication Question Bank</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e3e6ef;--accent:#3b5bdb;--done:#2f9e44}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
  header h1{margin:0 0 6px;font-size:18px}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>div{height:100%;width:0;background:var(--done);transition:width .25s}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:6px}
  button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer}
  main{max-width:860px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .card.done{border-color:var(--done)}
  .head{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fafbff;border-bottom:1px solid var(--line)}
  .head label{display:flex;gap:10px;align-items:center;cursor:pointer;flex:1;font-weight:700}
  .num{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px}
  .card.done .num{background:var(--done)}
  .tag{font-weight:500;font-size:13px;color:var(--muted)}
  .count{font-size:12px;color:var(--muted)}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;cursor:pointer}
  .q{padding:10px 14px;border-top:1px solid var(--line)}
  .q:first-of-type{border-top:0}
  .q>label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .q .txt{flex:1}
  .q.checked .txt .stem{color:var(--muted);text-decoration:line-through}
  .stem b{margin-right:4px}
  .opts{margin:6px 0 0 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 18px;color:#2b3550}
  .opt{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:3px 6px;border-radius:6px}
  .opt:hover{background:#f0f3ff}
  .opt input{width:18px;height:18px;margin-top:2px}
  .opt i{font-style:normal;color:var(--muted);margin-right:2px}
  .opt.on{background:#e7f5ec}
  .note{max-width:860px;margin:0 auto 24px;padding:0 16px;font-size:13px;color:var(--muted)}
  @media (max-width:520px){.opts{margin-left:8px}}
</style>
</head>
<body>

  <h1>Compulsory English – Grade XII · Question Bank (1–18)</h1>
  <div class="bar"><div id="bar"></div></div>
  <div class="meta"><span id="status">0 / 18 questions done</span><button id="reset">Reset all</button></div>
</header>
<main id="app"></main>
<p class="note">Tick the box beside a question number to mark the whole set done, or tick individual sub-questions (a–e). Progress is saved in this browser.</p>

 {q:"What guide words would you look between in the dictionary to find the word ‘CAMCORDER’?", o:["calf–camp","campground–capital","car–cart","cart–cat"]},
 {q:"I'm sorry, they aren't staying in this hotel any more. They ............ this morning.", o:["checked in","checked out","checked on","checked off"]}]},
{no:18, tag:"2079 Set E Q.No. 8 · Choosing the appropriate options, write correct answer [5×1=5]", qs:[
 {q:"Which of the following words has a different final sound?", o:["cats","boys","girls","houses"]},
 {q:"The initial sound in the word ‘maple’ is transcribed as", o:["/m/","/n/","/p/","/s/"]},
 {q:"Prices seem to ...... every year.", o:["raise","rise","raised","rose"]},
 {q:"The word ‘attire’ means ......", o:["extremely good","clothes, especially fine or formal ones","thin and easily torn","clear"]},
 {q:"My car .... while I was driving.", o:["broke up","broke off","broke down","broke in"]}]}
];

const KEY = "eng-qbank-checks-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
const letters = "abcdefghij";
const romans = ["i","ii","iii","iv","v","vi"];
const app = document.getElementById("app");

DATA.forEach(g => {
  const card = document.createElement("section");
  card.className = "card"; card.id = "q" + g.no;
  card.innerHTML = `
    <div class="head">
      <label><input type="checkbox" data-group="${g.no}">
        <span class="num">${g.no}</span>
        <span><span class="tag">${g.tag}</span></span></label>
      <span class="count"></span>
    </div>` +
    g.qs.map((x, i) => `
    <div class="q" data-key="${g.no}-${i}">
      <label><input type="checkbox" data-sub="${g.no}-${i}">
        <span class="txt"><span class="stem"><b>${letters[i]}.</b>${x.q}</span></span></label>
      ${x.o.length ? `<div class="opts">${x.o.map((o, j) => `<label class="opt"><input type="checkbox" data-opt="${g.no}-${i}-${j}"><span><i>${romans[j]}.</i> ${o}</span></label>`).join("")}</div>` : ""}
    </div>`).join("");
  app.appendChild(card);
});

function refresh() {
  let doneGroups = 0;
  DATA.forEach(g => {
    const card = document.getElementById("q" + g.no);
    let n = 0;
    g.qs.forEach((_, i) => {
      const k = g.no + "-" + i, on = !!state[k];
      const row = card.querySelector(`[data-key="${k}"]`);
      row.classList.toggle("checked", on);
      row.querySelector("[data-sub]").checked = on;
      row.querySelectorAll("[data-opt]").forEach(inp => {
        const v = !!state["o" + inp.dataset.opt];
        inp.checked = v;
        inp.closest(".opt").classList.toggle("on", v);
      });
      if (on) n++;
    });
    const groupOn = !!state["g" + g.no] || n === g.qs.length;
    card.querySelector("[data-group]").checked = groupOn;
    card.classList.toggle("done", groupOn);
    card.querySelector(".count").textContent = n + " / " + g.qs.length;
    if (groupOn) doneGroups++;
  });
  document.getElementById("bar").style.width = (doneGroups / DATA.length * 100) + "%";
  document.getElementById("status").textContent = doneGroups + " / " + DATA.length + " questions done";
}

app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.opt) {
    state["o" + t.dataset.opt] = t.checked;
    save(); refresh(); return;
  }
  if (t.dataset.group) {
    const no = +t.dataset.group, g = DATA.find(x => x.no === no);
    state["g" + no] = t.checked;
    g.qs.forEach((_, i) => state[no + "-" + i] = t.checked);
  } else if (t.dataset.sub) {
    state[t.dataset.sub] = t.checked;
    const no = +t.dataset.sub.split("-")[0];
    const g = DATA.find(x => x.no === no);
    state["g" + no] = g.qs.every((_, i) => state[no + "-" + i]);
  }
  save(); refresh();
});
document.getElementById("reset").onclick = () => {
  if (confirm("Clear all checkmarks?")) { state = {}; save(); refresh(); }
};
refresh();
</script>
</body>
</html>
